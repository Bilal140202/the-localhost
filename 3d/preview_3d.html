<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Localhost — 3D Fully Animated Sitcom (Episode 1)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #viewport-container {
      position: relative;
      width: 480px;
      height: 854px; /* 9:16 vertical ratio */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 240, 255, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #0a0e17;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .header {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #b026ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: #ff0055;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .subtitle-box {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-left: 4px solid #00f0ff;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      min-height: 60px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    .speaker {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .speaker.leo { color: #f59e0b; }
    .speaker.chip { color: #00f0ff; }
    .dialogue {
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }
    #controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111827;
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    button {
      background: #00f0ff;
      color: #050b14;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #38bdf8; transform: scale(1.04); }
    .toggle-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .toggle-btn.active {
      background: #b026ff;
      color: white;
      border-color: #b026ff;
    }
    input[type="range"] {
      width: 140px;
      accent-color: #00f0ff;
      cursor: pointer;
    }
    #time-display {
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
      min-width: 75px;
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <canvas id="render-canvas"></canvas>
    <div id="ui-overlay">
      <div class="header">
        <span class="title">THE LOCALHOST • 3D</span>
        <span class="badge">EP 01 • REAL 3D</span>
      </div>
      <div class="subtitle-box" id="subtitle-box">
        <div class="speaker leo" id="speaker-text">LEO</div>
        <div class="dialogue" id="dialogue-text">Press Play to begin...</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="play-btn">▶ Play</button>
    <input type="range" id="scrubber" min="0" max="28.8" step="0.05" value="0">
    <span id="time-display">00.0s / 28.8s</span>
    <button class="toggle-btn" id="camera-btn">Director Cam</button>
    <button class="toggle-btn" id="showcase-btn">Character Showcase</button>
  </div>

  <audio id="soundtrack" src="master_audio.wav" preload="auto"></audio>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="audio_envelope.js"></script>
  <script src="engine_3d.js"></script>
  <script>
    const canvas = document.getElementById('render-canvas');
    const width = 1080;
    const height = 1920;
    const sitcom = Sitcom3D.init(canvas, width, height);

    const orbit = new THREE.OrbitControls(sitcom.camera, canvas);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.05;
    orbit.enabled = false; // Director camera active by default

    const audio = document.getElementById('soundtrack');
    const playBtn = document.getElementById('play-btn');
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('time-display');
    const cameraBtn = document.getElementById('camera-btn');
    const showcaseBtn = document.getElementById('showcase-btn');
    const speakerText = document.getElementById('speaker-text');
    const dialogueText = document.getElementById('dialogue-text');

    let isPlaying = false;
    let camMode = 'director'; // 'director' | 'orbit' | 'showcase'
    let currentTime = 0;

    // Support URL query params for automated visual inspection (?mode=showcase&t=1.2)
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'showcase') {
      camMode = 'showcase';
      sitcom.setCameraMode('showcase');
      showcaseBtn.classList.add('active');
    }
    if (params.get('t')) {
      currentTime = parseFloat(params.get('t')) || 0;
      scrubber.value = currentTime;
      timeDisplay.textContent = currentTime.toFixed(1) + 's / 28.8s';
    }

    const subtitles = [
      { start: 0.5, end: 4.6, speaker: 'LEO', class: 'leo', text: "Chip, why did the smart dishwasher just order 400 lbs of dry ice?!" },
      { start: 5.0, end: 10.8, speaker: 'CHIP', class: 'chip', text: "Thermodynamic optimization! Solid carbon dioxide sublimates grease at sub-zero velocities." },
      { start: 11.2, end: 15.8, speaker: 'LEO', class: 'leo', text: "My dishes are literally frozen to the racks! The lasagna plate is a cryo-hazard!" },
      { start: 16.2, end: 22.4, speaker: 'CHIP', class: 'chip', text: "A zero-temperature state ensures zero bacterial entropy, Leo. You are welcome." },
      { start: 22.8, end: 25.5, speaker: 'LEO', class: 'leo', text: "I just wanted clean forks, man... not a glacier!" },
      { start: 25.6, end: 28.8, speaker: 'CHIP', class: 'chip', text: "*Glacier protocol complete. Forks are now immortal.*" }
    ];

    function updateSubtitles(t) {
      const match = subtitles.find(s => t >= s.start && t <= s.end);
      if (match) {
        speakerText.textContent = match.speaker;
        speakerText.className = 'speaker ' + match.class;
        dialogueText.textContent = match.text;
      } else {
        speakerText.textContent = 'THE LOCALHOST';
        speakerText.className = 'speaker';
        dialogueText.textContent = '...';
      }
    }

    cameraBtn.addEventListener('click', () => {
      if (camMode === 'orbit') {
        camMode = 'director';
        orbit.enabled = false;
        sitcom.setCameraMode('director');
        cameraBtn.textContent = 'Director Cam';
        cameraBtn.classList.remove('active');
        showcaseBtn.classList.remove('active');
      } else {
        camMode = 'orbit';
        orbit.enabled = true;
        sitcom.setCameraMode('orbit');
        cameraBtn.textContent = 'Free 3D Orbit';
        cameraBtn.classList.add('active');
        showcaseBtn.classList.remove('active');
      }
    });

    showcaseBtn.addEventListener('click', () => {
      camMode = 'showcase';
      orbit.enabled = false;
      sitcom.setCameraMode('showcase');
      cameraBtn.textContent = 'Director Cam';
      cameraBtn.classList.remove('active');
      showcaseBtn.classList.add('active');
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Play';
      } else {
        audio.currentTime = currentTime;
        audio.play().then(() => {
          isPlaying = true;
          playBtn.textContent = '⏸ Pause';
        });
      }
    });

    scrubber.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      audio.currentTime = currentTime;
      if (camMode !== 'orbit') sitcom.updateFrame(currentTime);
      updateSubtitles(currentTime);
      timeDisplay.textContent = currentTime.toFixed(1) + 's / 28.8s';
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
    });

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (isPlaying) {
        currentTime = audio.currentTime;
        scrubber.value = currentTime;
        timeDisplay.textContent = currentTime.toFixed(1) + 's / 28.8s';
        updateSubtitles(currentTime);
      }
      if (camMode !== 'orbit') {
        sitcom.updateFrame(currentTime);
      } else {
        orbit.update();
        sitcom.renderer.render(sitcom.scene, sitcom.camera);
      }
    }
    updateSubtitles(currentTime);
    sitcom.updateFrame(currentTime);
    renderLoop();
  </script>
</body>
</html>
