name: Notify Telegram on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to download and send to Telegram"
        required: false
        default: "v1.2.0-ep1"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release MP4 asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          gh release download "$TAG" -p "*.mp4" -D /tmp/release_assets
          ls -lh /tmp/release_assets

      - name: Send MP4 Video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          VIDEO_FILE=$(ls /tmp/release_assets/*.mp4 | head -n 1)
          curl -f -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=🎬 The Localhost — Episode 1: 'The Dish Dilemma' (${TAG})" \
            -F "supports_streaming=true" \
            -F "video=@${VIDEO_FILE}"
