name: Notify Telegram on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_url:
        description: "Release URL to share"
        required: false
        default: "https://github.com/Bilal140202/the-localhost/releases"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Telegram Release Link
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_URL: ${{ github.event.release.html_url || github.event.inputs.release_url }}
        run: python 3d/send_3d_to_telegram.py
